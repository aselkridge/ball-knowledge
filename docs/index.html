<style>
  :root{
    --ground:#100d0b;--panel:#1d1815;--line:#3a332a;
    --ink:#efe6d8;--ink-dim:#b3a894;--ink-faint:#7d735f;
    --accent:#f5872e;--accent-deep:#c9641a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(245,135,46,.12), transparent 62%),
      linear-gradient(180deg,#0b0908 0%,#171210 52%,#241b13 100%);
    color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:0;
  }
  .tip{
    font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);border:1px solid rgba(245,135,46,.35);border-radius:4px;
    padding:8px 18px;background:rgba(30,16,6,.6);
    animation:glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 16px rgba(245,135,46,.15)}50%{box-shadow:0 0 30px rgba(245,135,46,.4)}}
  h1{
    margin-top:26px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;
    font-size:clamp(44px,10vw,96px);line-height:.95;
  }
  h1 .k{color:var(--accent)}
  .tag{margin-top:16px;font-size:clamp(15px,3vw,19px);color:var(--ink-dim);max-width:34ch}
  .tag b{color:var(--ink)}
  .bug{position:fixed;top:14px;left:16px;width:42px;opacity:.92;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .emblem{
    margin-top:30px;width:clamp(150px,34vw,225px);
    filter:drop-shadow(0 0 34px rgba(245,135,46,.35)) drop-shadow(0 16px 30px rgba(0,0,0,.55));
    animation:float 7s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .play{
    display:inline-block;margin-top:34px;text-decoration:none;color:#241000;
    font-weight:800;font-size:16px;letter-spacing:.13em;text-transform:uppercase;
    padding:15px 34px;border-radius:4px;transform:skewX(-8deg);
    background:linear-gradient(100deg,#ffa14e,var(--accent) 55%,var(--accent-deep));
    box-shadow:5px 5px 0 rgba(36,16,0,.85),0 10px 26px rgba(245,135,46,.22);
  }
  .play:active{transform:skewX(-8deg) translate(3px,3px);box-shadow:2px 2px 0 rgba(36,16,0,.85)}
  .play span{display:inline-block;transform:skewX(8deg)}
  .status{
    margin-top:38px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .status b{color:var(--ink-dim);font-weight:700}
  footer{margin-top:14px;font-size:12px;color:var(--ink-faint)}
  footer a{color:var(--ink-dim)}
  @media (prefers-reduced-motion:reduce){.emblem,.tip{animation:none}}
</style>
</head>
<body>
  <img class="bug" src="play/assets/brand/mark.png" alt="">
  <div class="tip">The alpha is live · tip-off anytime</div>
  <img class="emblem" src="play/assets/brand/mark76.png" alt="">
  <h1>Ball<br><span class="k">Knowledge</span></h1>
  <p class="tag"><b>Your basketball knowledge is your jumpshot.</b><br>
  Turn-based hoops strategy — chess brain, trivia range, timing hands.</p>
  <a class="play" href="play/"><span>▶&ensp;Play the alpha</span></a>
  <div class="status">Build status · <b>alpha — playable in your browser</b> · packs &amp; squads next</div>
  <footer>A project by Aaron Selkridge · <a href="https://aselkridge.github.io/aarons-portfolio/">Aaronautics</a></footer>
</body>
</html>
