<style>
  :root{
    --ground:#100d0b;--panel:#1d1815;--line:#3a332a;
    --ink:#efe6d8;--ink-dim:#b3a894;--ink-faint:#7d735f;
    --accent:#f5872e;--accent-deep:#c9641a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(245,135,46,.12), transparent 62%),
      linear-gradient(180deg,#0b0908 0%,#171210 52%,#241b13 100%);
    color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:0;
  }
  .tip{
    font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);border:1px solid rgba(245,135,46,.35);border-radius:4px;
    padding:8px 18px;background:rgba(30,16,6,.6);
    animation:glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 16px rgba(245,135,46,.15)}50%{box-shadow:0 0 30px rgba(245,135,46,.4)}}
  h1{
    margin-top:26px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;
    font-size:clamp(44px,10vw,96px);line-height:.95;
  }
  h1 .k{color:var(--accent)}
  .tag{margin-top:16px;font-size:clamp(15px,3vw,19px);color:var(--ink-dim);max-width:34ch}
  .tag b{color:var(--ink)}
  .ball{
    margin-top:38px;width:76px;height:76px;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(245,135,46,.22));
    animation:bounce 1.5s cubic-bezier(.28,0,.55,1) infinite alternate;
  }
  .ball svg{display:block;width:100%;height:100%}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-26px)}}
  .shadow{
    width:56px;height:10px;border-radius:50%;margin-top:10px;
    background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent 70%);
    animation:sq 1.5s cubic-bezier(.28,0,.55,1) infinite alternate;
  }
  @keyframes sq{from{transform:scaleX(1);opacity:.8}to{transform:scaleX(.55);opacity:.4}}
  .status{
    margin-top:38px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .status b{color:var(--ink-dim);font-weight:700}
  footer{margin-top:14px;font-size:12px;color:var(--ink-faint)}
  footer a{color:var(--ink-dim)}
  @media (prefers-reduced-motion:reduce){.ball,.shadow,.tip{animation:none}}
</style>
</head>
<body>
  <div class="tip">Tip-off coming · under construction</div>
  <h1>Ball<br><span class="k">Knowledge</span></h1>
  <p class="tag"><b>Your basketball knowledge is your jumpshot.</b><br>
  Turn-based hoops strategy — chess brain, trivia range, timing hands.</p>
  <div class="ball" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="bg" cx="35%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#ffb976"/>
          <stop offset="45%" stop-color="#ef8330"/>
          <stop offset="80%" stop-color="#c05f14"/>
          <stop offset="100%" stop-color="#8a430c"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
      <g fill="none" stroke="#4a2408" stroke-width="2.6" opacity=".85">
        <path d="M2 50 H98"/>
        <path d="M50 2 V98"/>
        <path d="M15 15 Q50 40 85 15" transform="rotate(90 50 50)"/>
        <path d="M15 85 Q50 60 85 85" transform="rotate(90 50 50)"/>
      </g>
      <ellipse cx="35" cy="27" rx="16" ry="10" fill="#fff" opacity=".18" transform="rotate(-24 35 27)"/>
      <circle cx="50" cy="50" r="48" fill="none" stroke="#3a1c06" stroke-width="1.6" opacity=".6"/>
    </svg>
  </div>
  <div class="shadow" aria-hidden="true"></div>
  <div class="status">Build status · <b>M0 — the stage</b> · engine in progress</div>
  <footer>A project by Aaron Selkridge · <a href="https://aselkridge.github.io/aarons-portfolio/">Aaronautics</a></footer>
</body>
</html>
